[build]
  publish = "."
  command = ""

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"

# Serve the map thumbnail as local icons (same-origin, required for PWA)
[[redirects]]
  from   = "/icons/icon-192.jpg"
  to     = "https://cdn-0001.qstv.on.epicgames.com/glnukYzSdizuXhteXl/image/landscape_comp.jpeg"
  status = 200
  force  = true

[[redirects]]
  from   = "/icons/icon-512.jpg"
  to     = "https://cdn-0001.qstv.on.epicgames.com/glnukYzSdizuXhteXl/image/landscape_comp.jpeg"
  status = 200
  force  = true

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
