<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080808">
  <title>Granny Stats</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.jpg">
  <meta name="apple-mobile-web-app-title" content="Granny Stats">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap">
  <style>
    :root {
      --bg:      #080808;
      --card:    #111111;
      --border:  #222222;
      --green:   #00e676;
      --gold:    #ffc107;
      --blue:    #64b5f6;
      --purple:  #b39ddb;
      --dim:     #666;
      --text:    #f0f0f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ── HEADER ─────────────────────────────── */
    header {
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
    }
    .map-info { display: flex; align-items: center; gap: 10px; }
    .map-thumb {
      width: 40px; height: 40px;
      border-radius: 8px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }
    .map-name { font-size: 13px; font-weight: 800; letter-spacing: .2px; }
    .map-code { font-size: 11px; color: var(--dim); margin-top: 2px; }

    /* ── CLOCK BAR ──────────────────────────── */
    .clock-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px 20px 0;
    }
    .clock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .clock-time {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .clock-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--dim);
    }
    .clock-sep {
      width: 1px;
      background: #222;
      align-self: stretch;
      margin: 4px 0;
    }

    .live-pill {
      display: flex; align-items: center; gap: 5px;
      background: rgba(0,230,118,.1);
      border: 1px solid rgba(0,230,118,.2);
      border-radius: 20px;
      padding: 5px 11px;
      font-size: 11px; font-weight: 700;
      color: var(--green);
      flex-shrink: 0;
    }
    .live-dot {
      width: 6px; height: 6px;
      background: var(--green); border-radius: 50%;
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── TX TOGGLE ──────────────────────────── */
    .tx-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; padding: 10px 20px 0;
    }
    .tx-label { font-size: 11px; font-weight: 700; color: var(--dim); letter-spacing: .5px; }
    .tx-label.active { color: var(--gold); }
    .toggle-pill {
      position: relative; width: 44px; height: 24px;
      background: #222; border-radius: 12px; cursor: pointer;
      border: 1px solid #333; transition: background .2s;
      flex-shrink: 0;
    }
    .toggle-pill.on { background: rgba(255,193,7,.2); border-color: rgba(255,193,7,.4); }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #444; transition: transform .2s, background .2s;
    }
    .toggle-pill.on .toggle-thumb { transform: translateX(20px); background: var(--gold); }

    /* ── MAIN CONTENT ───────────────────────── */
    .page { padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; max-width: 480px; margin: 0 auto; }
    #page  { display: flex; flex-direction: column; gap: 12px; }

    /* ── HERO CARD ──────────────────────────── */
    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px 22px;
      text-align: center;
    }
    .hero-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
    .hero-number { font-size: 80px; font-weight: 800; line-height: 1; color: var(--green); letter-spacing: -3px; font-variant-numeric: tabular-nums; }
    .hero-sub { font-size: 12px; color: var(--dim); margin-top: 10px; }
    .hero-peaks { display: flex; justify-content: center; gap: 24px; margin-top: 14px; }
    .peak-item { text-align: center; }
    .peak-item .pv { font-size: 20px; font-weight: 800; }
    .peak-item .pl { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    /* ── ROW 2 CARDS ────────────────────────── */
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── CARD ───────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }
    .card-label { font-size: 10px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
    .card-value { font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
    .card-sub { font-size: 11px; color: var(--dim); margin-top: 6px; line-height: 1.4; }
    .card-sub strong { color: var(--text); font-weight: 600; }

    .c-gold   { color: var(--gold); }
    .c-purple { color: var(--purple); }
    .c-blue   { color: var(--blue); }
    .c-green  { color: var(--green); }

    /* ── WIDE CARD ──────────────────────────── */
    .card-wide {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
    }
    .total-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .total-big { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
    .total-tag {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      background: rgba(179,157,219,.15);
      border: 1px solid rgba(179,157,219,.25);
      color: var(--purple);
      border-radius: 6px; padding: 3px 8px;
      align-self: center;
    }

    /* ── MONTHLY CARD ───────────────────────── */
    .monthly-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    /* Month navigation */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .month-nav-title { font-size: 13px; font-weight: 800; color: var(--text); }
    .month-btn {
      background: var(--border);
      border: none;
      color: var(--text);
      width: 28px; height: 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .month-btn:disabled { opacity: .25; cursor: default; }

    /* Month pills */
    .month-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .month-pills::-webkit-scrollbar { display: none; }
    .month-pill {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--dim);
      transition: all .15s;
    }
    .month-pill.active {
      background: rgba(0,230,118,.12);
      border-color: rgba(0,230,118,.3);
      color: var(--green);
    }
    .month-pill.future { opacity: .3; cursor: default; }

    /* Bar chart */
    .bar-chart-wrap { position: relative; height: 170px; margin-bottom: 4px; }
    .bar-chart-wrap canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; cursor: crosshair; }

    /* Tooltip */
    #chart-tooltip {
      position: fixed;
      pointer-events: none;
      display: none;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 9px 13px;
      z-index: 999;
      min-width: 110px;
      box-shadow: 0 8px 24px rgba(0,0,0,.6);
    }
    .tt-day   { font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
    .tt-val   { font-size: 20px; font-weight: 900; color: #ffc107; line-height: 1; }
    .tt-label { font-size: 10px; color: #555; margin-top: 3px; }

    /* Monthly summary */
    .monthly-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .msumm {
      background: #181818;
      border-radius: 10px;
      padding: 12px;
    }
    .msumm .ml { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
    .msumm .mv { font-size: 22px; font-weight: 900; }

    /* Loading bar chart */
    .chart-loading { height: 120px; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; }

    /* ── LINK BUTTON ────────────────────────── */
    .link-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      color: var(--blue);
      font-size: 13px; font-weight: 700;
      text-decoration: none;
    }

    /* ── NOTIF BANNER ───────────────────────── */
    .notif-banner {
      background: rgba(0,230,118,.08);
      border: 1px solid rgba(0,230,118,.2);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      color: var(--green);
      display: flex; align-items: center; gap: 10px;
      cursor: pointer;
    }
    .notif-banner.hidden { display: none; }

    /* ── FOOTER ─────────────────────────────── */
    .footer { text-align: center; font-size: 10px; color: #333; padding-top: 4px; }

    /* ── TOP LOADER BAR ─────────────────────── */
    #top-loader {
      position: fixed; top: 0; left: 0; z-index: 9999;
      height: 2px; width: 0%;
      background: linear-gradient(90deg, var(--green), #69f0ae);
      box-shadow: 0 0 10px rgba(0,230,118,.7);
      opacity: 0;
      pointer-events: none;
      transition: width .35s ease, opacity .4s ease;
    }

    /* ── ESTIMATIONS SECTION ───────────────── */
    .estimates-section {
      background: var(--card);
      border: 1px dashed #282828;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .estimates-header { display: flex; align-items: center; gap: 8px; }
    .estimates-title {
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--dim);
    }
    .estimates-badge {
      font-size: 10px; font-weight: 700; color: #555;
      background: #181818; border: 1px solid #282828;
      border-radius: 4px; padding: 1px 6px;
      font-style: italic;
    }
    .estimates-divider { height: 1px; background: #1c1c1c; }
    .estimates-group-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      color: #444; margin-bottom: 8px;
    }
    .proj-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .proj-card {
      background: #0d0d0d;
      border: 1px solid #1c1c1c;
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }
    .proj-label { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #444; margin-bottom: 5px; }
    .proj-value { font-size: 20px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }

    /* ── LOADING / ERROR ────────────────────── */
    .loading { padding: 80px 20px; text-align: center; color: var(--dim); font-size: 13px; }
    .spinner {
      width: 32px; height: 32px;
      border: 2.5px solid #222;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: #110808; border: 1px solid #3a1111;
      border-radius: 14px; padding: 20px; text-align: center;
      color: #ef5350; font-size: 13px; line-height: 1.6;
    }

    /* ── SIMULATOR ──────────────────────────────── */
    .sim-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px 18px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .sim-section-title {
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--dim);
    }
    .sim-input {
      background: #0d0d0d; border: 1px solid #282828;
      border-radius: 10px; color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums;
      padding: 12px 14px; width: 100%;
      -moz-appearance: textfield;
    }
    .sim-input::-webkit-inner-spin-button,
    .sim-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .sim-input:focus { outline: none; border-color: #444; }
    .sim-earn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sim-r { background: #0d0d0d; border-radius: 10px; padding: 10px 12px; }
    .sim-rl { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #444; margin-bottom: 3px; }
    .sim-rv { font-size: 17px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
    .sim-divider { height: 1px; background: #1c1c1c; }
    .sim-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .sim-field { display: flex; flex-direction: column; gap: 5px; }
    .sim-label { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #444; }
    .sim-input-sm {
      background: #0d0d0d; border: 1px solid #282828;
      border-radius: 8px; color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
      padding: 9px 10px; width: 100%;
      -moz-appearance: textfield;
    }
    .sim-input-sm::-webkit-inner-spin-button,
    .sim-input-sm::-webkit-outer-spin-button { -webkit-appearance: none; }
    .sim-input-sm:focus { outline: none; border-color: #444; }
    .sim-result-box {
      background: #0d0d0d; border-radius: 10px; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .sim-roi-row { display: flex; justify-content: space-between; align-items: center; }
    .sim-breakeven {
      font-size: 11px; color: #444;
      border-top: 1px solid #1c1c1c; padding-top: 8px;
    }
    .sim-breakeven strong { color: var(--text); }
  </style>
</head>
<body>

<div id="top-loader"></div>

<header>
  <div class="map-info">
    <img class="map-thumb"
         src="https://cdn-0001.qstv.on.epicgames.com/glnukYzSdizuXhteXl/image/landscape_comp.jpeg"
         onerror="this.src='https://fortnite.gg/img/items/52/icon.jpg?1'" alt="">
    <div>
      <div class="map-name">SURVIVE GRANNY</div>
      <div class="map-code">4482-9358-0065</div>
    </div>
  </div>
  <div class="live-pill"><div class="live-dot"></div>LIVE</div>
</header>

<div class="clock-bar">
  <div class="clock-item">
    <div class="clock-time" id="clock-paris">--:--:--</div>
    <div class="clock-label">🇫🇷 Paris</div>
  </div>
  <div class="clock-sep"></div>
  <div class="clock-item">
    <div class="clock-time" id="clock-et">--:--:--</div>
    <div class="clock-label">🇺🇸 New York ET</div>
  </div>
</div>

<div class="tx-bar">
  <span class="tx-label active" id="tx-off-label">Base</span>
  <div class="toggle-pill on" id="tx-toggle" onclick="toggleTx()">
    <div class="toggle-thumb"></div>
  </div>
  <span class="tx-label active" id="tx-on-label">×2.7 transactions</span>
</div>

<div class="page">
  <div id="page">
    <div class="loading"><div class="spinner"></div>Chargement…</div>
  </div>

  <div id="monthly-section"></div>

  <!-- SIMULATEUR (statique — persiste entre les refreshs) -->
  <div class="sim-card" id="sim-section" style="display:none">
    <div class="sim-section-title">Simulateur de gains</div>
    <div>
      <div class="sim-label" style="margin-bottom:8px">Nombre de joueurs</div>
      <input class="sim-input" type="number" id="sim-players" value="0" min="0"
             oninput="_simEdited=true;updateSim()">
    </div>
    <div class="sim-earn-grid" id="sim-earn-results"></div>

    <div class="sim-divider"></div>
    <div class="sim-section-title">Campagne Fortnite</div>
    <div class="sim-grid">
      <div class="sim-field">
        <div class="sim-label">Budget ($)</div>
        <input class="sim-input-sm" type="number" id="sim-budget" value="500" min="0" oninput="updateCampaign()">
      </div>
      <div class="sim-field">
        <div class="sim-label">+Joueurs moy.</div>
        <input class="sim-input-sm" type="number" id="sim-boost" value="50" min="0" oninput="updateCampaign()">
      </div>
      <div class="sim-field">
        <div class="sim-label">Durée (jours)</div>
        <input class="sim-input-sm" type="number" id="sim-days" value="7" min="1" oninput="updateCampaign()">
      </div>
    </div>
    <div class="sim-result-box" id="sim-campaign-result"></div>
  </div>

  <a class="link-btn" href="https://fortnite.gg/island/4482-9358-0065" target="_blank" rel="noopener">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      <polyline points="15 3 21 3 21 9"/>
      <line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
    Voir sur fortnite.gg
  </a>

  <div class="footer">Mis à jour à <span id="update-time">--:--</span> · refresh auto 60s · 🇺🇸 <span id="et-time">--:--</span> ET</div>
</div>

<div id="chart-tooltip">
  <div class="tt-day"></div>
  <div class="tt-val"></div>
  <div class="tt-label"></div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────
const ISLAND_ID    = 519527;
const ISLAND_URL   = 'https://fortnite.gg/island/4482-9358-0065';
const API_ISLAND   = `https://fortnite.gg/island?id=${ISLAND_ID}&ranks`;
const API_STATS    = `https://fortnite.gg/island?id=${ISLAND_ID}`;          // actual values, no ranks
const API_GRAPH    = `https://fortnite.gg/player-count-graph?range=1d&id=${ISLAND_ID}`;
const API_YEAR     = `https://fortnite.gg/player-count-graph?range=1y&id=${ISLAND_ID}`;
const PROXY_OWN    = '/.netlify/functions/proxy?url=';  // our own — fast, server-side
const PROXY        = 'https://api.allorigins.win/get?url=';
const PROXY2       = 'https://corsproxy.io/?';
const REFRESH_MS   = 60_000;

const RATE       = 1 / 1000;   // $1 per 1000 player-minutes
const MULTIPLIER = 2.7;        // ×2.7 (playtime + transactions)
const MILESTONES = [50, 100, 150, 200, 250, 300, 350, 400, 500];

const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MONTHS_SHORT = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];

// ── STATE ─────────────────────────────────────────────
let yearlyDays        = null;
let notifPermission   = Notification?.permission ?? 'default';
let withTransactions  = true;
let _lastIsland = null, _lastGraph = null, _lastParsed = null;
let _todayActualMinutes = null; // today's player-minutes from the 1d graph, midnight-to-now
// Paris date for initial state
const _p = new Intl.DateTimeFormat('en-US', { timeZone:'Europe/Paris', year:'numeric', month:'numeric' }).formatToParts(new Date());
let selectedMonth = parseInt(_p.find(x => x.type === 'month').value) - 1;
let selectedYear  = parseInt(_p.find(x => x.type === 'year').value);

// ── TX TOGGLE ─────────────────────────────────────────
function toggleTx() {
  withTransactions = !withTransactions;
  const pill    = document.getElementById('tx-toggle');
  const onLabel = document.getElementById('tx-on-label');
  const offLabel= document.getElementById('tx-off-label');
  pill?.classList.toggle('on', withTransactions);
  if (onLabel)  onLabel.style.color  = withTransactions ? 'var(--gold)' : 'var(--dim)';
  if (offLabel) offLabel.style.color = withTransactions ? 'var(--dim)'  : 'var(--text)';
  if (_lastGraph) render(_lastIsland, _lastGraph, _lastParsed);
  updateSim();
}

// ── FETCH ─────────────────────────────────────────────
function fetchT(url, ms) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal, cache: 'no-store' }).finally(() => clearTimeout(tid));
}

async function getJSON(url) {
  // 1. Own Netlify proxy — server-side, no CORS, fast
  try {
    const r = await fetchT(PROXY_OWN + encodeURIComponent(url), 6000);
    if (r.ok) return r.json();
  } catch (_) {}

  // 2. Race external proxies as fallback
  return new Promise((resolve, reject) => {
    let failures = 0;
    const onFail = () => { if (++failures === 2) reject(new Error('fetch failed: ' + url)); };

    fetchT(PROXY + encodeURIComponent(url), 15000)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(w => JSON.parse(w.contents))
      .then(resolve).catch(onFail);

    fetchT(PROXY2 + encodeURIComponent(url), 15000)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(resolve).catch(onFail);
  });
}

async function getText(url) {
  // 1. Own Netlify proxy — returns body directly
  try {
    const r = await fetchT(PROXY_OWN + encodeURIComponent(url), 6000);
    if (r.ok) return r.text();
  } catch (_) {}

  // 2. Race external proxies as fallback
  return new Promise(resolve => {
    let done = false;
    const ok = v => { if (!done) { done = true; resolve(v); } };
    setTimeout(() => ok(''), 16000);

    fetchT(PROXY + encodeURIComponent(url), 15000)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(w => ok(w.contents || ''))
      .catch(() => {});

    fetchT(PROXY2 + encodeURIComponent(url), 15000)
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(ok)
      .catch(() => {});
  });
}

// ── PARSE HTML ────────────────────────────────────────
function parseK(str) {
  if (!str) return 0;
  const n = parseFloat(str);
  if (str.endsWith('M')) return Math.round(n * 1_000_000);
  if (str.endsWith('K')) return Math.round(n * 1_000);
  return Math.round(n);
}

function parseHTML(html) {
  if (!html) return {};
  const h = html.replace(/&amp;/g, '&');

  // Target: >(number) immediately before <a ... id='rank-X'>
  // e.g. >314.9K <a href='...' id='rank-total_ccu'>#</a>
  function extractStat(id) {
    const re = new RegExp(`>([\\d.]+[KMB]?)\\s*<a[^>]+id=['"]${id}['"]`);
    const m  = h.match(re);
    if (m) return m[1];

    // Fallback: last number in the 200 chars before the id (less accurate)
    let pos = h.indexOf(`id='${id}'`);
    if (pos === -1) pos = h.indexOf(`id="${id}"`);
    if (pos === -1) return null;
    const before  = h.slice(Math.max(0, pos - 200), pos);
    const matches = [...before.matchAll(/>([\d.]+[KMB]?)/g)];
    return matches.length ? matches[matches.length - 1][1] : null;
  }

  return {
    totalMinutes: parseK(extractStat('rank-total_ccu')),
    allTimePeak:  extractStat('rank-peak') ?? null,
    favorites:    extractStat('rank-total_favorites') ?? null,
  };
}

// ── TODAY MINUTES FROM 1D GRAPH (midnight → now, Paris) ──
function computeTodayMinutes(graph) {
  const { start, step, values_avg, values } = graph.data;
  const avgs = values_avg ?? values ?? [];
  const now  = parisNow();
  let total  = 0;
  avgs.forEach((avg, i) => {
    const ts = (start + i * step) * 1000;
    const p  = toParisParts(ts);
    if (p.year === now.year && p.month === now.month && p.day === now.day) {
      total += avg * (step / 60);
    }
  });
  return total;
}

// ── PARIS TIMEZONE HELPERS ────────────────────────────
function parisNow() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Europe/Paris',
    year: 'numeric', month: 'numeric', day: 'numeric',
    hour: 'numeric', minute: 'numeric', hour12: false,
  }).formatToParts(new Date());
  const g = t => parseInt(parts.find(p => p.type === t).value);
  return { year: g('year'), month: g('month') - 1, day: g('day'), hour: g('hour'), minute: g('minute') };
}

function toParisParts(tsMs) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Europe/Paris',
    year: 'numeric', month: 'numeric', day: 'numeric',
  }).formatToParts(new Date(tsMs));
  const g = t => parseInt(parts.find(p => p.type === t).value);
  return { year: g('year'), month: g('month') - 1, day: g('day') };
}

function parisTimeStr() {
  return new Intl.DateTimeFormat('fr-FR', {
    timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit',
  }).format(new Date());
}

function etTimeStr() {
  return new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit',
    hour12: true,
  }).format(new Date());
}

function parisTimeSecStr() {
  return new Intl.DateTimeFormat('fr-FR', {
    timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', second: '2-digit',
  }).format(new Date());
}

function etTimeSecStr() {
  return new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit', second: '2-digit',
    hour12: true,
  }).format(new Date());
}

// ── AGGREGATE YEARLY DATA BY DAY (Paris TZ) ───────────
function aggregateByDay(graphData) {
  const { start, step, values_avg, values } = graphData.data;
  const avgs = values_avg ?? values ?? [];
  const days = {};

  avgs.forEach((avg, i) => {
    const ts  = (start + i * step) * 1000;
    const { year, month, day } = toParisParts(ts);
    const key = `${year}-${month}-${day}`;
    if (!days[key]) days[key] = { year, month, day, minutes: 0 };
    days[key].minutes += avg * (step / 60);
  });

  return Object.values(days).sort((a, b) =>
    new Date(a.year, a.month, a.day) - new Date(b.year, b.month, b.day)
  );
}

function getDaysForMonth(year, month) {
  return (yearlyDays ?? []).filter(d => d.year === year && d.month === month);
}

function earningForDay(dayData) {
  return dayData.minutes / 1000 * MULTIPLIER;
}

// ── MONEY FORMAT ──────────────────────────────────────
function money(dollars) {
  if (dollars >= 1000) return '$' + (dollars / 1000).toFixed(2) + 'K';
  return '$' + dollars.toFixed(2);
}
function fmt(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(1) + 'K';
  return String(n);
}

// ── BAR CHART ENGINE ──────────────────────────────────
let _chartBars    = [];
let _chartCanvas  = null;
let _chartHovered = -1;
let _barRects     = []; // { x, w } per bar for hit-testing

function _niceScale(max) {
  const steps = [0.25, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500];
  for (const s of steps) if (max / s <= 5) return s;
  return Math.ceil(max / 5);
}

function _drawBars(highlightIdx) {
  const canvas = _chartCanvas;
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  if (!canvas._init) {
    canvas.width  = canvas.offsetWidth  * dpr;
    canvas.height = canvas.offsetHeight * dpr;
    canvas._init  = true;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const W      = canvas.offsetWidth;
  const H      = canvas.offsetHeight;
  const LABEL  = 18;
  const LEFT   = 36; // y-axis label space
  const chartW = W - LEFT;
  const chartH = H - LABEL;
  const bars   = _chartBars;
  const n      = bars.length;

  ctx.clearRect(0, 0, W, H);

  const maxE    = Math.max(...bars.map(b => Math.max(b.earnings, b.predicted ?? 0)), 0.01);
  const scale   = _niceScale(maxE);
  const gridMax = Math.ceil(maxE / scale) * scale;

  // ── Grid lines + Y labels
  const gridCount = Math.min(4, Math.ceil(gridMax / scale));
  for (let g = 0; g <= gridCount; g++) {
    const val = (g / gridCount) * gridMax;
    const y   = chartH - (val / gridMax) * (chartH - 6);
    ctx.strokeStyle = g === 0 ? '#2a2a2a' : '#1e1e1e';
    ctx.lineWidth   = g === 0 ? 1.5 : 1;
    ctx.setLineDash(g === 0 ? [] : [3, 4]);
    ctx.beginPath();
    ctx.moveTo(LEFT, y);
    ctx.lineTo(W, y);
    ctx.stroke();
    ctx.setLineDash([]);

    if (g > 0) {
      ctx.fillStyle  = '#444';
      ctx.font       = '8px system-ui';
      ctx.textAlign  = 'right';
      ctx.fillText('$' + (val >= 1 ? val.toFixed(0) : val.toFixed(1)), LEFT - 3, y + 3);
    }
  }

  // ── Bars
  const gap  = 2;
  const barW = Math.max(3, (chartW - gap * (n + 1)) / n);
  _barRects  = [];

  bars.forEach((b, i) => {
    const x    = LEFT + gap + i * (barW + gap);
    const barH = b.earnings > 0 ? Math.max(3, (b.earnings / gridMax) * (chartH - 8)) : 0;
    const y    = chartH - barH;
    const r    = Math.min(4, barW / 2);
    const isHL = i === highlightIdx;

    _barRects.push({ x, w: barW, bar: b, idx: i });

    // Ghost prediction bar (today only)
    if (b.isToday && b.predicted > b.earnings) {
      const ghostH = Math.max(3, (b.predicted / gridMax) * (chartH - 8));
      const ghostY = chartH - ghostH;
      const rg     = Math.min(4, barW / 2);
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle   = '#ffc107';
      ctx.beginPath();
      ctx.moveTo(x + rg, ghostY);
      ctx.lineTo(x + barW - rg, ghostY);
      ctx.quadraticCurveTo(x + barW, ghostY, x + barW, ghostY + rg);
      ctx.lineTo(x + barW, chartH);
      ctx.lineTo(x, chartH);
      ctx.lineTo(x, ghostY + rg);
      ctx.quadraticCurveTo(x, ghostY, x + rg, ghostY);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      // Dashed top line
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = '#ffc107';
      ctx.lineWidth   = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(x, ghostY);
      ctx.lineTo(x + barW, ghostY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    // Color
    let base, glow;
    if (b.isToday)        { base = '#ffc107'; glow = 'rgba(255,193,7,.25)'; }
    else if (b.isFuture)  { base = '#191919'; glow = null; }
    else if (b.earnings > 0) { base = '#00e676'; glow = 'rgba(0,230,118,.2)'; }
    else                  { base = '#1a1a1a'; glow = null; }

    // Glow on hover
    if (isHL && glow) {
      ctx.fillStyle = glow;
      ctx.fillRect(x - 3, 0, barW + 6, chartH);
    }

    if (barH > 0) {
      // Gradient bar
      const grad = ctx.createLinearGradient(0, y, 0, chartH);
      if (b.isToday) {
        grad.addColorStop(0, isHL ? '#ffe082' : '#ffc107');
        grad.addColorStop(1, isHL ? '#ff8f00' : '#e65100');
      } else if (b.isFuture) {
        grad.addColorStop(0, '#222');
        grad.addColorStop(1, '#181818');
      } else {
        grad.addColorStop(0, isHL ? '#69f0ae' : '#00e676');
        grad.addColorStop(1, isHL ? '#00c853' : '#00897b');
      }

      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + barW - r, y);
      ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
      ctx.lineTo(x + barW, chartH);
      ctx.lineTo(x, chartH);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // Top shimmer
      if (!b.isFuture) {
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(x, y, barW, Math.min(6, barH));
      }
    } else {
      ctx.fillStyle = b.isFuture ? '#161616' : '#1c1c1c';
      ctx.fillRect(x, chartH - 2, barW, 2);
    }

    // Day labels
    const show = b.day === 1 || b.day % 5 === 0 || b.day === n || b.isToday || isHL;
    if (show) {
      ctx.fillStyle = b.isToday ? '#ffc107' : (isHL ? '#aaa' : '#3a3a3a');
      ctx.font      = `${(b.isToday || isHL) ? '700 ' : ''}9px system-ui`;
      ctx.textAlign = 'center';
      ctx.fillText(b.day, x + barW / 2, H - 4);
    }
  });
}

function drawBarChart(canvasId, bars) {
  _chartBars   = bars;
  _chartCanvas = document.getElementById(canvasId);
  _chartHovered = -1;
  if (!_chartCanvas) return;
  _chartCanvas._init = false;

  _drawBars(-1);

  // Events
  _chartCanvas.onmousemove  = _onChartHover;
  _chartCanvas.onmouseleave = _onChartLeave;
  _chartCanvas.ontouchstart = _onChartTouch;
  _chartCanvas.ontouchmove  = _onChartTouch;
  _chartCanvas.ontouchend   = _onChartLeave;
}

function _hitBar(clientX) {
  if (!_chartCanvas) return -1;
  const rect = _chartCanvas.getBoundingClientRect();
  const mx   = clientX - rect.left;
  return _barRects.findIndex(b => mx >= b.x && mx <= b.x + b.w);
}

function _onChartHover(e) {
  const idx = _hitBar(e.clientX);
  if (idx !== _chartHovered) {
    _chartHovered = idx;
    _drawBars(idx);
  }
  if (idx >= 0) _showTooltip(e.clientX, e.clientY, _chartBars[idx]);
  else          _hideTooltip();
}

function _onChartTouch(e) {
  e.preventDefault();
  const t = e.touches[0];
  if (!t) return;
  _onChartHover({ clientX: t.clientX, clientY: t.clientY });
}

function _onChartLeave() {
  _chartHovered = -1;
  _drawBars(-1);
  _hideTooltip();
}

function _showTooltip(cx, cy, bar) {
  const tt = document.getElementById('chart-tooltip');
  if (!tt) return;

  const label = bar.isToday ? "Aujourd'hui" : bar.isFuture ? 'À venir' : `Jour ${bar.day}`;
  const val   = bar.isFuture ? '—' : money(bar.earnings);
  const color = bar.isToday ? '#ffc107' : bar.isFuture ? '#444' : '#00e676';
  const predLine = bar.isToday && bar.predicted > bar.earnings
    ? `<div class="tt-label" style="color:rgba(255,193,7,.6)">→ fin de journée ~${money(bar.predicted)}</div>`
    : '';

  tt.innerHTML = `
    <div class="tt-day">${label}</div>
    <div class="tt-val" style="color:${color}">${val}</div>
    <div class="tt-label">${bar.isFuture ? 'Pas encore passé' : 'Gains estimés'}</div>
    ${predLine}`;
  tt.style.display = 'block';

  // Position: above cursor, avoid edges
  const pad = 12;
  let left = cx + 14;
  let top  = cy - 70;
  const ttW = 120, ttH = 70;
  if (left + ttW > window.innerWidth - pad)  left = cx - ttW - 14;
  if (top < pad)                              top  = cy + 14;
  if (top + ttH > window.innerHeight - pad)  top  = window.innerHeight - ttH - pad;
  tt.style.left = left + 'px';
  tt.style.top  = top  + 'px';
}

function _hideTooltip() {
  const tt = document.getElementById('chart-tooltip');
  if (tt) tt.style.display = 'none';
}

async function askNotifPermission() {
  if (!('Notification' in window)) return;

function checkMilestones(players) {
  if (notifPermission !== 'granted') return;
  const last = parseInt(localStorage.getItem('lastMilestone') || '0');
  const crossed = MILESTONES.filter(m => players >= m);
  if (!crossed.length) { if (last > 0) localStorage.setItem('lastMilestone', '0'); return; }
  const highest = crossed[crossed.length - 1];
  if (highest > last) {
    new Notification('🎮 Survive Granny', {
      body: `🔥 ${highest} joueurs en ce moment !`,
      icon: 'https://cdn-0001.qstv.on.epicgames.com/glnukYzSdizuXhteXl/image/landscape_comp.jpeg',
    });
    localStorage.setItem('lastMilestone', highest);
  }
  if (players < last * 0.6) localStorage.setItem('lastMilestone', crossed[crossed.length - 1]);
}

// ── RENDER MONTHLY SECTION ────────────────────────────
function renderMonthly() {
  const now   = parisNow();
  const today = now.day;
  const isCurrentMonth = selectedMonth === now.month && selectedYear === now.year;
  const daysInMonth    = new Date(selectedYear, selectedMonth + 1, 0).getDate();

  // Build data lookup from yearlyDays
  const dataMap = {};
  (yearlyDays ?? []).forEach(d => {
    if (d.year === selectedYear && d.month === selectedMonth)
      dataMap[d.day] = d.minutes;
  });

  // Build full bar array — ALL days of month
  const bars = [];
  for (let day = 1; day <= daysInMonth; day++) {
    const isFuture = isCurrentMonth && day > today;
    const isToday  = isCurrentMonth && day === today;
    // For today use the 1d graph filtered midnight→now (more accurate than yearly API)
    const minutes  = isToday && _todayActualMinutes !== null
      ? _todayActualMinutes
      : (dataMap[day] ?? 0);
    const earnings = isFuture ? 0 : (minutes / 1000 * (withTransactions ? MULTIPLIER : 1));
    bars.push({
      day,
      earnings,
      isPast:   !isFuture && !isToday,
      isToday,
      isFuture,
    });
  }

  // Totals (only past + today)
  const monthTotal     = bars.filter(b => !b.isFuture).reduce((s, b) => s + b.earnings, 0);
  const daysPassed     = isCurrentMonth ? today : daysInMonth;

  // Projection: extrapolate today's partial data to avoid bias at 3am
  let projection;
  if (isCurrentMonth) {
    const pastEarnings      = bars.filter(b => b.isPast).reduce((s, b) => s + b.earnings, 0);
    const todayBar          = bars.find(b => b.isToday);
    const hoursElapsed      = now.hour + now.minute / 60;
    const todayExtrapolated = todayBar && hoursElapsed > 0
      ? todayBar.earnings * (24 / hoursElapsed)
      : (todayBar?.earnings ?? 0);
    if (todayBar) todayBar.predicted = todayExtrapolated;
    const pastDays          = bars.filter(b => b.isPast).length;
    const avgPerDay         = (pastEarnings + todayExtrapolated) / (pastDays + 1);
    projection              = avgPerDay * daysInMonth;
  } else {
    projection = daysPassed > 0 ? (monthTotal / daysPassed) * daysInMonth : 0;
  }

  // Month pills
  const pills = MONTHS_SHORT.map((name, i) => {
    const isFuture = selectedYear === now.year && i > now.month;
    const isActive = i === selectedMonth;
    return `<button class="month-pill ${isActive ? 'active' : ''} ${isFuture ? 'future' : ''}"
              ${isFuture ? 'disabled' : `onclick="selectMonth(${i})"`}>${name}</button>`;
  }).join('');

  const prevDisabled = selectedMonth === 0 && selectedYear <= now.year - 1;
  const nextDisabled = isCurrentMonth;

  document.getElementById('monthly-section').innerHTML = `
    <div class="monthly-card">
      <div class="month-nav">
        <button class="month-btn" onclick="changeMonth(-1)" ${prevDisabled ? 'disabled' : ''}>‹</button>
        <span class="month-nav-title">${MONTHS_FR[selectedMonth]} ${selectedYear}</span>
        <button class="month-btn" onclick="changeMonth(1)" ${nextDisabled ? 'disabled' : ''}>›</button>
      </div>

      <div class="month-pills" id="pills-row">${pills}</div>

      <div class="bar-chart-wrap">
        <canvas id="barChart"></canvas>
      </div>

      <div class="monthly-summary">
        <div class="msumm">
          <div class="ml">${isCurrentMonth ? 'Ce mois-ci' : 'Total du mois'}</div>
          <div class="mv c-gold">${money(monthTotal)}</div>
        </div>
        <div class="msumm">
          <div class="ml">Projection / mois</div>
          <div class="mv c-purple">${money(projection)}</div>
        </div>
      </div>
    </div>
  `;

  requestAnimationFrame(() => {
    drawBarChart('barChart', bars);
    document.querySelector('.month-pill.active')
      ?.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
  });
}

function selectMonth(month) {
  selectedMonth = month;
  renderMonthly();
}

function changeMonth(dir) {
  const now = parisNow();
  let m = selectedMonth + dir;
  let y = selectedYear;
  if (m < 0)  { m = 11; y--; }
  if (m > 11) { m = 0;  y++; }
  if (y > now.year || (y === now.year && m > now.month)) return;
  selectedMonth = m;
  selectedYear  = y;
  renderMonthly();
}

        <div class="card-sub">Au rythme actuel · <strong>${fmt(currentPlayers)}</strong> joueurs</div>
      </div>
      <div class="card">
        <div class="card-label">Dernières 24h</div>
        <div class="card-value c-gold">${money(todayEarnings)}</div>
        <div class="card-sub"><strong>${fmt(Math.round(todayMinutes))}</strong> min jouées</div>
      </div>
    </div>

    <!-- ESTIMATIONS -->
    <div class="estimates-section">
      <div class="estimates-header">
        <span class="estimates-title">Estimations</span>
        <span class="estimates-badge">approximatif</span>
      </div>

      <div>
        <div class="estimates-group-label">Rythme actuel · ${fmt(currentPlayers)} joueurs</div>
        <div class="proj-row">
          <div class="proj-card">
            <div class="proj-label">/ jour</div>
            <div class="proj-value">${money(perHour * 24)}</div>
          </div>
          <div class="proj-card">
            <div class="proj-label">/ mois</div>
            <div class="proj-value">${money(perHour * 24 * 30)}</div>
          </div>
          <div class="proj-card">
            <div class="proj-label">/ an</div>
            <div class="proj-value">${money(perHour * 24 * 365)}</div>
          </div>
        </div>
      </div>

      <div class="estimates-divider"></div>

      <div>
        <div class="estimates-group-label">Basé sur les dernières 24h</div>
        <div class="proj-row">
          <div class="proj-card">
            <div class="proj-label">/ jour</div>
            <div class="proj-value">${money(todayEarnings)}</div>
          </div>
          <div class="proj-card">
            <div class="proj-label">/ mois</div>
            <div class="proj-value">${money(todayEarnings * 30)}</div>
          </div>
          <div class="proj-card">
            <div class="proj-label">/ an</div>
            <div class="proj-value">${money(todayEarnings * 365)}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- GAINS TOTAUX -->
    <div class="card-wide">
      <div class="card-label">Gains totaux estimés</div>
      <div class="total-row">
        <div class="total-big c-purple">${money(totalEarnings)}</div>
        <div class="total-tag">${withTransactions ? '×2.7' : '×1'}</div>
      </div>
      <div class="card-sub" style="margin-top:8px">
        Basé sur <strong>${fmt(totalMinutes)}</strong> min jouées · $1 = 1 000 min
      </div>
    </div>

  `;

  // Update static elements outside #page
  const timeEl = document.getElementById('update-time');
  if (timeEl) timeEl.textContent = time;
  const etEl = document.getElementById('et-time');
  if (etEl) etEl.textContent = etTimeStr();
  const simEl = document.getElementById('sim-section');
  if (simEl) simEl.style.display = '';
  updateSim(currentPlayers);

  renderMonthly();
}

// ── SIMULATOR ─────────────────────────────────────────
let _simEdited = false;

function updateSim(defaultPlayers) {
  const input = document.getElementById('sim-players');
  if (!input) return;
  if (defaultPlayers !== undefined && !_simEdited) input.value = defaultPlayers;
  const players = Math.max(0, parseInt(input.value) || 0);
  const mult    = withTransactions ? MULTIPLIER : 1;
  const perHour = players * 60 * RATE * mult;
  const el = document.getElementById('sim-earn-results');
  if (el) el.innerHTML = `
    <div class="sim-r"><div class="sim-rl">/ heure</div><div class="sim-rv">${money(perHour)}</div></div>
    <div class="sim-r"><div class="sim-rl">/ jour</div><div class="sim-rv">${money(perHour * 24)}</div></div>
    <div class="sim-r"><div class="sim-rl">/ mois</div><div class="sim-rv">${money(perHour * 24 * 30)}</div></div>
    <div class="sim-r"><div class="sim-rl">/ an</div><div class="sim-rv">${money(perHour * 24 * 365)}</div></div>`;
  updateCampaign();
}

function updateCampaign() {
  const budget = Math.max(0, parseFloat(document.getElementById('sim-budget')?.value) || 0);
  const boost  = Math.max(0, parseInt(document.getElementById('sim-boost')?.value)  || 0);
  const days   = Math.max(1, parseInt(document.getElementById('sim-days')?.value)   || 1);
  const mult   = withTransactions ? MULTIPLIER : 1;
  const extraEarn  = boost * days * 1440 * RATE * mult;
  const profit     = extraEarn - budget;
  const breakEven  = budget > 0 ? Math.ceil(budget / (days * 1440 * RATE * mult)) : 0;
  const isWin      = profit >= 0;
  const el = document.getElementById('sim-campaign-result');
  if (!el) return;
  el.innerHTML = `
    <div class="sim-roi-row">
      <div>
        <div class="sim-rl">Gains campagne</div>
        <div class="sim-rv" style="color:var(--blue);font-size:20px">${money(extraEarn)}</div>
      </div>
      <div style="text-align:right">
        <div class="sim-rl">${isWin ? 'Profit net' : 'Perte nette'}</div>
        <div class="sim-rv" style="color:${isWin ? 'var(--green)' : '#ef5350'};font-size:20px">${isWin ? '+' : ''}${money(profit)}</div>
      </div>
    </div>
    ${budget > 0 ? `<div class="sim-breakeven">Break-even : <strong>${breakEven} joueurs</strong> en moyenne sur ${days}j</div>` : ''}`;
}

// ── CACHE ─────────────────────────────────────────────
function saveCache(island, graph, parsed, yearly) {
  try {
    localStorage.setItem('gh_island', JSON.stringify(island));
    localStorage.setItem('gh_graph',  JSON.stringify(graph));
    localStorage.setItem('gh_parsed', JSON.stringify(parsed));
    localStorage.setItem('gh_yearly', JSON.stringify(yearly));
  } catch (_) {}
}

function loadCache() {
  try {
    const island = JSON.parse(localStorage.getItem('gh_island'));
    const graph  = JSON.parse(localStorage.getItem('gh_graph'));
    const parsed = JSON.parse(localStorage.getItem('gh_parsed'));
    const yearly = JSON.parse(localStorage.getItem('gh_yearly'));
    if (island && graph && parsed) return { island, graph, parsed, yearly };
  } catch (_) {}
  return null;
}

// ── TOP LOADER ────────────────────────────────────────
let _loaderTick = null;
let _loaderPct  = 0;

function showLoader() {
  const bar = document.getElementById('top-loader');
  if (!bar) return;
  clearInterval(_loaderTick);
  _loaderPct = 15;
  bar.style.opacity = '1';
  bar.style.width   = _loaderPct + '%';
  _loaderTick = setInterval(() => {
    _loaderPct += (88 - _loaderPct) * 0.07;
    bar.style.width = _loaderPct + '%';
  }, 400);
}

function hideLoader() {
  clearInterval(_loaderTick);
  const bar = document.getElementById('top-loader');
  if (!bar) return;
  bar.style.width = '100%';
  setTimeout(() => {
    bar.style.opacity = '0';
    setTimeout(() => { bar.style.width = '0%'; }, 450);
  }, 200);
}

// ── LOAD ──────────────────────────────────────────────
let _loadAttempt = 0;

async function load() {
  _loadAttempt++;
  showLoader();

  // Phase 1 — only what's needed to show numbers (2 requests, fast)
  const [graphRes, statsRes] = await Promise.allSettled([
    getJSON(API_GRAPH),
    getText(ISLAND_URL),
  ]);

  if (graphRes.status === 'rejected') {
    if (_loadAttempt < 3) { setTimeout(load, 4000); return; }
    hideLoader();
    _loadAttempt = 0;
    if (!document.querySelector('.hero')) {
      document.getElementById('page').innerHTML = `
        <div class="error-box">
          Erreur de chargement<br>
          <small>Les serveurs sont lents ou hors ligne.</small><br><br>
          <button onclick="_loadAttempt=0;load()"
            style="margin-top:8px;padding:8px 20px;border:none;border-radius:8px;
                   background:#ef5350;color:#fff;font-weight:700;cursor:pointer;font-size:13px">
            Réessayer
          </button>
        </div>`;
    }
    return;
  }
  _loadAttempt = 0;

  const htmlParsed = statsRes.status === 'fulfilled' ? parseHTML(statsRes.value) : {};
  const parsed = {
    totalMinutes: htmlParsed.totalMinutes || 0,
    allTimePeak:  htmlParsed.allTimePeak  ?? null,
    favorites:    htmlParsed.favorites    ?? null,
  };

  saveCache(null, graphRes.value, parsed, yearlyDays);
  render(null, graphRes.value, parsed);
  hideLoader();

  // Phase 2 — yearly data for monthly chart, loads in background
  getJSON(API_YEAR).then(yearData => {
    yearlyDays = aggregateByDay(yearData);
    saveCache(null, graphRes.value, parsed, yearlyDays);
    renderMonthly();
  }).catch(() => {});
}

// Render cached data immediately so the user never sees a blank screen
const _cached = loadCache();
if (_cached) {
  if (_cached.yearly) yearlyDays = _cached.yearly;
  render(_cached.island, _cached.graph, _cached.parsed);
}

load();
setInterval(load, REFRESH_MS);

// ── CLOCK (live, updates every second) ───────────────
function tickClocks() {
  const paris = document.getElementById('clock-paris');
  const et    = document.getElementById('clock-et');
  const etFt  = document.getElementById('et-time');
  if (paris) paris.textContent = parisTimeSecStr();
  if (et)    et.textContent    = etTimeSecStr();
  if (etFt)  etFt.textContent  = etTimeStr();
}
tickClocks();
setInterval(tickClocks, 1000);

// ── SERVICE WORKER ────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
